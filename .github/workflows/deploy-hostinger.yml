name: Verify Hostinger build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Hostinger (static and standalone)
        env:
          NEXT_PUBLIC_SITE_URL: https://vayucred.com
          NEXT_PUBLIC_ALLOW_INDEXING: "true"
        run: npm run build:hostinger

      - name: Verify Hostinger output
        run: |
          test -s out/index.html
          test -s out/.htaccess
          test -s out/robots.txt
          test -s out/sitemap.xml
          test -s .next/standalone/server.js
          test -d .next/standalone/public
          test -d .next/standalone/.next/static
          PORT=3417 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:3417/ > /dev/null
          curl --fail --silent http://127.0.0.1:3417/about/ > /dev/null
          curl --fail --silent http://127.0.0.1:3417/robots.txt | grep -q "Allow: /"
