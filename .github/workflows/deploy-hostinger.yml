name: Verify Hostinger build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Hostinger (static export)
        env:
          NEXT_PUBLIC_SITE_URL: https://vayucred.com
          NEXT_PUBLIC_ALLOW_INDEXING: "true"
        run: npm run build:hostinger

      - name: Verify Hostinger output
        run: |
          test -s out/index.html
          test -s out/.htaccess
          test -s out/robots.txt
          test -s out/sitemap.xml
